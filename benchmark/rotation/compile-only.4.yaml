version: 1

name: "rotation-compile-only"
author: "Anonymous"
metadata:
  tags: ["rotation", "compile-only", "compilator"]
  notes: "n=4 rot_Y compile-only benchmark, 10000 repeats."

params:
  config_path: "benchmark/bqc/trapped-ions_200.json"

  nodes:
  - node_name: client
    num_qubits: 1
    inputs: {}

  - node_name: server
    num_qubits: 1
    inputs: {}

  qstate_formalism: "DM"

execution:
  iterations: 10000
  cpu_count: 11
  on_failure: "stop"
  store_logs: false
  log_level: "INFO"

pipeline:
  compilator:
    enabled: true
    artifact_subdir: "compilator"
    repeats: 10000
    on_failure: "stop"

    python:
      workdir: "."
      venv_python:
      extra_sys_path: []

    variables:
      n: 4
      n_int: 2

    python_sources:
    - name: "client"
      source_file: "client.py"
      function: "client_full_turn"
      method: "compile"
      method_args: ["server", "{var:n}", "{var:n_int}"]
      method_kwargs: {}
      result_tuple_index: 1
      output_file: "{source_name}.hir.mlir"

    - name: "server"
      source_file: "server.py"
      function: "server_full_turn"
      method: "compile"
      method_args: ["client", "{var:n}"]
      method_kwargs: {}
      result_tuple_index: 1
      output_file: "{source_name}.hir.mlir"

    tools:
      optimizer:
        bin: "/home/spoukke/workspaces/tudelft/qoala-mlir/build/bin/qoala-opt"
        base_flags: []

      translator:
        bin: "/home/spoukke/workspaces/tudelft/qoala-mlir/build/bin/qoala-translate"
        base_flags: []
        flags: []

    variants:
    - name: "rotation"
      optimizer_passes:
      - name: "step1_hir_to_mir"
        flags: ["--lower-qoala-hir-to-mir"]
        output_file: "{source_name}.1.mir.mlir"

      - name: "step2_mir_to_lir"
        flags: ["--lower-qoala-mir-to-lir"]
        output_file: "{source_name}.2.lir.mlir"

      - name: "step3_rotfold"
        depends_on: "python"
        flags: ["--qnet-peephole-optimizations=rotation-folding=true normalize-angles=false"]
        output_file: "{source_name}.3.rotfold.hir.mlir"

      - name: "step4_hir_to_mir_opt"
        depends_on: "step3_rotfold"
        flags: ["--lower-qoala-hir-to-mir"]
        output_file: "{source_name}.4.opt.mir.mlir"

      - name: "step5_mir_to_lir_opt"
        depends_on: "step4_hir_to_mir_opt"
        flags: ["--lower-qoala-mir-to-lir"]
        output_file: "{source_name}.5.opt.lir.mlir"

      - name: "step6_reorder"
        depends_on: "step5_mir_to_lir_opt"
        flags: ["--qoalahost-reorder-blocks"]
        output_file: "{source_name}.6.opt.reorder.lir.mlir"

      - name: step_esp_unopt
        depends_on: step2_mir_to_lir
        flags:
        - --qoalahost-show-analysis-esp
        - --qoala-opt-single-gate-duration={json:single_gate_duration}
        - --qoala-opt-single-gate-error={json:single_gate_error}
        - --qoala-opt-two-gate-duration={json:two_gate_duration}
        - --qoala-opt-dual-gate-error={json:two_gate_error}
        - --qoala-opt-latency={json:latency}
        - --qoala-opt-link-duration={json:link_duration}
        - --qoala-opt-host-instr-time={json:host_instr_time}
        - --qoala-opt-host-peer-latency={json:host_peer_latency}
        - --qoala-opt-qnos-instr-time={json:qnos_instr_time}
        - --qoala-opt-qubit-lifetime={json:t2}
        output_file: '{source_name}.esp.unopt.txt'
      - name: step_qmem_unopt
        depends_on: step2_mir_to_lir
        flags:
        - --qoalahost-show-analysis-qmem-eff
        output_file: '{source_name}.qmem_eff.unopt.txt'
      - name: step_esp_opt
        depends_on: step6_reorder
        flags:
        - --qoalahost-show-analysis-esp
        - --qoala-opt-single-gate-duration={json:single_gate_duration}
        - --qoala-opt-single-gate-error={json:single_gate_error}
        - --qoala-opt-two-gate-duration={json:two_gate_duration}
        - --qoala-opt-dual-gate-error={json:two_gate_error}
        - --qoala-opt-latency={json:latency}
        - --qoala-opt-link-duration={json:link_duration}
        - --qoala-opt-host-instr-time={json:host_instr_time}
        - --qoala-opt-host-peer-latency={json:host_peer_latency}
        - --qoala-opt-qnos-instr-time={json:qnos_instr_time}
        - --qoala-opt-qubit-lifetime={json:t2}
        output_file: '{source_name}.esp.opt.txt'
      - name: step_qmem_opt
        depends_on: step6_reorder
        flags:
        - --qoalahost-show-analysis-qmem-eff
        output_file: '{source_name}.qmem_eff.opt.txt'
      program_variants:
      - name: "unoptimized"
        input_pass: "step2_mir_to_lir"
        flags: ["--mlir-to-iqoala"]
        output_file: "{source_name}.unoptimized.iqoala"

      - name: "optimized"
        input_pass: "step6_reorder"
        flags: ["--mlir-to-iqoala"]
        output_file: "{source_name}.optimized.iqoala"

  generator:
    type: "compare"
    params:
      programs:
      - label: "unoptimized"
        program_variant: "unoptimized"
      - label: "optimized"
        program_variant: "optimized"

  analyzer:
    type: "simple"
    params:
      node: "server"
      outcome_key: "PLACEHOLDER"
      success_value: 1
